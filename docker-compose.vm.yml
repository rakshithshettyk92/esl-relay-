services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: esl_relay
      POSTGRES_USER: esl_relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - esl_postgres_data:/var/lib/postgresql/data
    networks:
      - esl_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esl_relay -d esl_relay"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  relay:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.vm
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://esl_relay:${POSTGRES_PASSWORD}@db:5432/esl_relay
    volumes:
      - esl_relay_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      esl_internal:
      solum_apps:
        aliases:
          - employee-call-relay
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  esl_internal:
    internal: true
  solum_apps:
    external: true
    name: solum_apps

volumes:
  esl_postgres_data:
  esl_relay_data:
