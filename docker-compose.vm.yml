services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: esl_relay
      POSTGRES_USER: esl_relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - esl_postgres_data:/var/lib/postgresql/data
    networks:
      - esl_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esl_relay -d esl_relay"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  relay:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.vm
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://esl_relay:${POSTGRES_PASSWORD}@db:5432/esl_relay
    volumes:
      - esl_relay_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - esl_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/esl.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt/live/20.121.68.137/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - /etc/letsencrypt/live/20.121.68.137/privkey.pem:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      relay:
        condition: service_healthy
    networks:
      - esl_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  esl_internal:
    internal: true

volumes:
  esl_postgres_data:
  esl_relay_data:
